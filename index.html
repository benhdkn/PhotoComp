<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhotoComp</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, sans-serif;
            background: #1c1c1e;
            color: #f2f2f7;
        }

        h1 { margin: 0 0 24px; font-size: 22px; }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #8e8e93;
            margin-bottom: 10px;
        }

        /* Count picker */
        .count-picker {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .count-btn {
            width: 38px;
            height: 38px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #f2f2f7;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .count-btn:hover { background: #3a3a3c; }

        .count-btn.active {
            background: #f2f2f7;
            color: #1c1c1e;
            border-color: #f2f2f7;
            font-weight: 600;
        }

        /* Pattern picker */
        #pattern-section { margin-bottom: 24px; display: none; }

        .pattern-list { display: flex; gap: 10px; flex-wrap: wrap; }

        .pattern-thumb {
            cursor: pointer;
            border: 2px solid #3a3a3c;
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .pattern-thumb:hover { border-color: #8e8e93; }
        .pattern-thumb.active { border-color: #f2f2f7; }

        .pattern-thumb span {
            font-size: 10px;
            color: #8e8e93;
        }

        .pattern-thumb.active span { color: #f2f2f7; }

        /* Composition */
        #composition {
            position: relative;
            width: 600px;
            height: 600px;
            background: #2c2c2e;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .frame {
            position: absolute;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            border: 5px solid white;
        }

        /* Actions */
        .actions { display: flex; gap: 12px; align-items: center; }

        #file { display: none; }

        .file-label {
            display: inline-block;
            padding: 8px 16px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            color: #f2f2f7;
        }

        .file-label:hover { background: #3a3a3c; }

        .file-label.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        #save {
            padding: 8px 20px;
            background: #f2f2f7;
            color: #1c1c1e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
        }

        #save:hover { background: #d1d1d6; }

        #save:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
    <script src="libs/dom-to-image.min.js"></script>
</head>
<body>
    <h1>PhotoComp</h1>

    <div class="label">Number of photos</div>
    <div class="count-picker" id="count-picker"></div>

    <div id="pattern-section">
        <div class="label">Layout</div>
        <div class="pattern-list" id="pattern-list"></div>
    </div>

    <div id="composition"></div>

    <div class="actions">
        <label class="file-label disabled" id="file-label" for="file">Choose photos</label>
        <input type="file" id="file" accept="image/jpeg,image/png" multiple>
        <button id="save" disabled>Export</button>
    </div>

    <script>
        const EXPORT_WIDTH = 4000;
        const EXPORT_HEIGHT = 4000;
        const THUMB_W = 60;
        const THUMB_H = 60;
        const ACCEPTED_TYPES = ['image/jpeg', 'image/png', 'image/jpg'];

        const GRID_PATTERNS = {
            2: [
                {
                    id: '2-cols', name: 'Side by side',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 50, height: 100 },
                    ]
                },
                {
                    id: '2-rows', name: 'Stacked',
                    frames: [
                        { top: 0, left: 0, width: 100, height: 50 },
                        { top: 50, left: 0, width: 100, height: 50 },
                    ]
                },
            ],
            3: [
                {
                    id: '3-1left-2right', name: '1 left + 2 right',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 50, width: 50, height: 50 },
                    ]
                },
                {
                    id: '3-2left-1right', name: '2 left + 1 right',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 50, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 100 },
                    ]
                },
                {
                    id: '3-cols', name: '3 columns',
                    frames: [
                        { top: 0, left: 0, width: 33.33, height: 100 },
                        { top: 0, left: 33.33, width: 33.34, height: 100 },
                        { top: 0, left: 66.67, width: 33.33, height: 100 },
                    ]
                },
                {
                    id: '3-2top-1bottom', name: '2 top + 1 bottom',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 0, width: 100, height: 50 },
                    ]
                },
            ],
            4: [
                {
                    id: '4-2x2', name: '2×2 grid',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 0, width: 50, height: 50 },
                        { top: 50, left: 50, width: 50, height: 50 },
                    ]
                },
                {
                    id: '4-1left-3right', name: '1 left + 3 right',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 50, height: 33.33 },
                        { top: 33.33, left: 50, width: 50, height: 33.34 },
                        { top: 66.67, left: 50, width: 50, height: 33.33 },
                    ]
                },
                {
                    id: '4-3left-1right', name: '3 left + 1 right',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 33.33 },
                        { top: 33.33, left: 0, width: 50, height: 33.34 },
                        { top: 66.67, left: 0, width: 50, height: 33.33 },
                        { top: 0, left: 50, width: 50, height: 100 },
                    ]
                },
                {
                    id: '4-1top-3bottom', name: '1 top + 3 bottom',
                    frames: [
                        { top: 0, left: 0, width: 100, height: 50 },
                        { top: 50, left: 0, width: 33.33, height: 50 },
                        { top: 50, left: 33.33, width: 33.34, height: 50 },
                        { top: 50, left: 66.67, width: 33.33, height: 50 },
                    ]
                },
            ],
            5: [
                {
                    id: '5-2top-3bottom', name: '2 top + 3 bottom',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 0, width: 33.33, height: 50 },
                        { top: 50, left: 33.33, width: 33.34, height: 50 },
                        { top: 50, left: 66.67, width: 33.33, height: 50 },
                    ]
                },
                {
                    id: '5-3top-2bottom', name: '3 top + 2 bottom',
                    frames: [
                        { top: 0, left: 0, width: 33.33, height: 50 },
                        { top: 0, left: 33.33, width: 33.34, height: 50 },
                        { top: 0, left: 66.67, width: 33.33, height: 50 },
                        { top: 50, left: 0, width: 50, height: 50 },
                        { top: 50, left: 50, width: 50, height: 50 },
                    ]
                },
                {
                    id: '5-1large-4small', name: '1 large + 4 small',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 25, height: 50 },
                        { top: 0, left: 75, width: 25, height: 50 },
                        { top: 50, left: 50, width: 25, height: 50 },
                        { top: 50, left: 75, width: 25, height: 50 },
                    ]
                },
            ],
            6: [
                {
                    id: '6-3x2', name: '3×2 grid',
                    frames: [
                        { top: 0, left: 0, width: 33.33, height: 50 },
                        { top: 0, left: 33.33, width: 33.34, height: 50 },
                        { top: 0, left: 66.67, width: 33.33, height: 50 },
                        { top: 50, left: 0, width: 33.33, height: 50 },
                        { top: 50, left: 33.33, width: 33.34, height: 50 },
                        { top: 50, left: 66.67, width: 33.33, height: 50 },
                    ]
                },
                {
                    id: '6-2x3', name: '2×3 grid',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 33.33 },
                        { top: 0, left: 50, width: 50, height: 33.33 },
                        { top: 33.33, left: 0, width: 50, height: 33.34 },
                        { top: 33.33, left: 50, width: 50, height: 33.34 },
                        { top: 66.67, left: 0, width: 50, height: 33.33 },
                        { top: 66.67, left: 50, width: 50, height: 33.33 },
                    ]
                },
                {
                    id: '6-2large-4small', name: '2 top + 4 bottom',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 0, width: 25, height: 50 },
                        { top: 50, left: 25, width: 25, height: 50 },
                        { top: 50, left: 50, width: 25, height: 50 },
                        { top: 50, left: 75, width: 25, height: 50 },
                    ]
                },
            ],
            7: [
                {
                    id: '7-3top-4bottom', name: '3 top + 4 bottom',
                    frames: [
                        { top: 0, left: 0, width: 33.33, height: 50 },
                        { top: 0, left: 33.33, width: 33.34, height: 50 },
                        { top: 0, left: 66.67, width: 33.33, height: 50 },
                        { top: 50, left: 0, width: 25, height: 50 },
                        { top: 50, left: 25, width: 25, height: 50 },
                        { top: 50, left: 50, width: 25, height: 50 },
                        { top: 50, left: 75, width: 25, height: 50 },
                    ]
                },
                {
                    id: '7-4top-3bottom', name: '4 top + 3 bottom',
                    frames: [
                        { top: 0, left: 0, width: 25, height: 50 },
                        { top: 0, left: 25, width: 25, height: 50 },
                        { top: 0, left: 50, width: 25, height: 50 },
                        { top: 0, left: 75, width: 25, height: 50 },
                        { top: 50, left: 0, width: 33.33, height: 50 },
                        { top: 50, left: 33.33, width: 33.34, height: 50 },
                        { top: 50, left: 66.67, width: 33.33, height: 50 },
                    ]
                },
                {
                    id: '7-1large-6small', name: '1 large + 6 small',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 16.67, height: 50 },
                        { top: 0, left: 66.67, width: 16.67, height: 50 },
                        { top: 0, left: 83.33, width: 16.67, height: 50 },
                        { top: 50, left: 50, width: 16.67, height: 50 },
                        { top: 50, left: 66.67, width: 16.67, height: 50 },
                        { top: 50, left: 83.33, width: 16.67, height: 50 },
                    ]
                },
            ],
            8: [
                {
                    id: '8-4x2', name: '4×2 grid',
                    frames: [
                        { top: 0, left: 0, width: 25, height: 50 },
                        { top: 0, left: 25, width: 25, height: 50 },
                        { top: 0, left: 50, width: 25, height: 50 },
                        { top: 0, left: 75, width: 25, height: 50 },
                        { top: 50, left: 0, width: 25, height: 50 },
                        { top: 50, left: 25, width: 25, height: 50 },
                        { top: 50, left: 50, width: 25, height: 50 },
                        { top: 50, left: 75, width: 25, height: 50 },
                    ]
                },
                {
                    id: '8-2x4', name: '2×4 grid',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 25 },
                        { top: 0, left: 50, width: 50, height: 25 },
                        { top: 25, left: 0, width: 50, height: 25 },
                        { top: 25, left: 50, width: 50, height: 25 },
                        { top: 50, left: 0, width: 50, height: 25 },
                        { top: 50, left: 50, width: 50, height: 25 },
                        { top: 75, left: 0, width: 50, height: 25 },
                        { top: 75, left: 50, width: 50, height: 25 },
                    ]
                },
                {
                    id: '8-2large-6small', name: '2 top + 6 bottom',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 0, width: 16.67, height: 50 },
                        { top: 50, left: 16.67, width: 16.67, height: 50 },
                        { top: 50, left: 33.33, width: 16.67, height: 50 },
                        { top: 50, left: 50, width: 16.67, height: 50 },
                        { top: 50, left: 66.67, width: 16.67, height: 50 },
                        { top: 50, left: 83.33, width: 16.67, height: 50 },
                    ]
                },
            ],
            9: [
                {
                    id: '9-3x3', name: '3×3 grid',
                    frames: [
                        { top: 0, left: 0, width: 33.33, height: 33.33 },
                        { top: 0, left: 33.33, width: 33.34, height: 33.33 },
                        { top: 0, left: 66.67, width: 33.33, height: 33.33 },
                        { top: 33.33, left: 0, width: 33.33, height: 33.34 },
                        { top: 33.33, left: 33.33, width: 33.34, height: 33.34 },
                        { top: 33.33, left: 66.67, width: 33.33, height: 33.34 },
                        { top: 66.67, left: 0, width: 33.33, height: 33.33 },
                        { top: 66.67, left: 33.33, width: 33.34, height: 33.33 },
                        { top: 66.67, left: 66.67, width: 33.33, height: 33.33 },
                    ]
                },
                {
                    id: '9-1large-8small', name: '1 large + 8 small',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 25, height: 50 },
                        { top: 0, left: 75, width: 25, height: 50 },
                        { top: 50, left: 0, width: 16.67, height: 50 },
                        { top: 50, left: 16.67, width: 16.67, height: 50 },
                        { top: 50, left: 33.33, width: 16.67, height: 50 },
                        { top: 50, left: 50, width: 16.67, height: 50 },
                        { top: 50, left: 66.67, width: 16.67, height: 50 },
                        { top: 50, left: 83.33, width: 16.67, height: 50 },
                    ]
                },
            ],
            10: [
                {
                    id: '10-5x2', name: '5×2 grid',
                    frames: [
                        { top: 0, left: 0, width: 20, height: 50 },
                        { top: 0, left: 20, width: 20, height: 50 },
                        { top: 0, left: 40, width: 20, height: 50 },
                        { top: 0, left: 60, width: 20, height: 50 },
                        { top: 0, left: 80, width: 20, height: 50 },
                        { top: 50, left: 0, width: 20, height: 50 },
                        { top: 50, left: 20, width: 20, height: 50 },
                        { top: 50, left: 40, width: 20, height: 50 },
                        { top: 50, left: 60, width: 20, height: 50 },
                        { top: 50, left: 80, width: 20, height: 50 },
                    ]
                },
                {
                    id: '10-2x5', name: '2×5 grid',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 20 },
                        { top: 0, left: 50, width: 50, height: 20 },
                        { top: 20, left: 0, width: 50, height: 20 },
                        { top: 20, left: 50, width: 50, height: 20 },
                        { top: 40, left: 0, width: 50, height: 20 },
                        { top: 40, left: 50, width: 50, height: 20 },
                        { top: 60, left: 0, width: 50, height: 20 },
                        { top: 60, left: 50, width: 50, height: 20 },
                        { top: 80, left: 0, width: 50, height: 20 },
                        { top: 80, left: 50, width: 50, height: 20 },
                    ]
                },
                {
                    id: '10-4top-6bottom', name: '4 top + 6 bottom',
                    frames: [
                        { top: 0, left: 0, width: 25, height: 50 },
                        { top: 0, left: 25, width: 25, height: 50 },
                        { top: 0, left: 50, width: 25, height: 50 },
                        { top: 0, left: 75, width: 25, height: 50 },
                        { top: 50, left: 0, width: 16.67, height: 50 },
                        { top: 50, left: 16.67, width: 16.67, height: 50 },
                        { top: 50, left: 33.33, width: 16.67, height: 50 },
                        { top: 50, left: 50, width: 16.67, height: 50 },
                        { top: 50, left: 66.67, width: 16.67, height: 50 },
                        { top: 50, left: 83.33, width: 16.67, height: 50 },
                    ]
                },
            ],
        };

        let currentPattern = null;
        let loadedImages = [];

        function init() {
            const countPicker = document.getElementById('count-picker');
            for (let n = 2; n <= 10; n++) {
                const btn = document.createElement('button');
                btn.className = 'count-btn';
                btn.textContent = n;
                btn.dataset.count = n;
                btn.addEventListener('click', () => selectCount(n));
                countPicker.appendChild(btn);
            }

            document.getElementById('file').addEventListener('change', onFileChange);
            document.getElementById('save').addEventListener('click', saveToJpg);
        }

        function selectCount(n) {
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.classList.toggle('active', Number(btn.dataset.count) === n);
            });
            renderPatternPicker(n);
            document.getElementById('pattern-section').style.display = 'block';
        }

        function renderPatternPicker(count) {
            const list = document.getElementById('pattern-list');
            list.innerHTML = '';
            currentPattern = null;

            GRID_PATTERNS[count].forEach(pattern => {
                const thumb = document.createElement('div');
                thumb.className = 'pattern-thumb';
                thumb.dataset.patternId = pattern.id;

                thumb.appendChild(createPatternSvg(pattern.frames));

                const label = document.createElement('span');
                label.textContent = pattern.name;
                thumb.appendChild(label);

                thumb.addEventListener('click', () => selectPattern(count, pattern.id));
                list.appendChild(thumb);
            });
        }

        function selectPattern(count, patternId) {
            currentPattern = GRID_PATTERNS[count].find(p => p.id === patternId);

            document.querySelectorAll('.pattern-thumb').forEach(thumb => {
                thumb.classList.toggle('active', thumb.dataset.patternId === patternId);
            });

            applyPattern(currentPattern);
        }

        function createPatternSvg(frames) {
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('width', THUMB_W);
            svg.setAttribute('height', THUMB_H);
            svg.setAttribute('viewBox', '0 0 500 500');

            const bg = document.createElementNS(ns, 'rect');
            bg.setAttribute('width', '500');
            bg.setAttribute('height', '500');
            bg.setAttribute('fill', '#3a3a3c');
            svg.appendChild(bg);

            frames.forEach(f => {
                const rect = document.createElementNS(ns, 'rect');
                rect.setAttribute('x', f.left / 100 * 500);
                rect.setAttribute('y', f.top / 100 * 500);
                rect.setAttribute('width', f.width / 100 * 500);
                rect.setAttribute('height', f.height / 100 * 500);
                rect.setAttribute('fill', '#6e6e73');
                rect.setAttribute('stroke', '#1c1c1e');
                rect.setAttribute('stroke-width', '12');
                svg.appendChild(rect);
            });

            return svg;
        }

        function applyPattern(pattern) {
            const composition = document.getElementById('composition');
            composition.innerHTML = '';

            pattern.frames.forEach((f, i) => {
                const frame = document.createElement('div');
                frame.className = 'frame';
                frame.id = `frame-${i}`;
                frame.style.top = `${f.top}%`;
                frame.style.left = `${f.left}%`;
                frame.style.width = `${f.width}%`;
                frame.style.height = `${f.height}%`;
                composition.appendChild(frame);
            });

            renderFrames(loadedImages);

            document.getElementById('file-label').classList.remove('disabled');
        }

        function onFileChange() {
            const files = Array.from(this.files).filter(file => {
                if (!ACCEPTED_TYPES.includes(file.type)) {
                    alert(`Invalid file type: ${file.name}`);
                    return false;
                }
                return true;
            });

            if (!files.length) return;

            loadImages(files)
                .then(images => {
                    loadedImages = images;
                    renderFrames(loadedImages);
                    document.getElementById('save').disabled = false;
                })
                .catch(err => {
                    console.error('Failed to load images:', err);
                    alert('Failed to load one or more images.');
                });
        }

        function loadImages(files) {
            const promises = files.map(file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = () => reject(new Error(`Failed to read: ${file.name}`));
                reader.readAsDataURL(file);
            }));
            return Promise.all(promises);
        }

        function renderFrames(images) {
            if (!currentPattern) return;
            images.forEach((src, i) => {
                const frame = document.getElementById(`frame-${i}`);
                if (frame) frame.style.backgroundImage = `url(${src})`;
            });
        }

        function saveToJpg() {
            const composition = document.getElementById('composition');

            composition.style.width = `${EXPORT_WIDTH}px`;
            composition.style.height = `${EXPORT_HEIGHT}px`;

            domtoimage.toJpeg(composition, { quality: 1, width: EXPORT_WIDTH, height: EXPORT_HEIGHT })
                .then(dataUrl => {
                    const link = document.createElement('a');
                    link.download = 'composition.jpeg';
                    link.href = dataUrl;
                    link.click();
                })
                .catch(err => {
                    console.error('Export failed:', err);
                    alert('Export failed. See console for details.');
                })
                .finally(() => {
                    composition.style.width = '600px';
                    composition.style.height = '600px';
                });
        }

        init();
    </script>
</body>
</html>
