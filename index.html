<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhotoComp</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, sans-serif;
            background: #1c1c1e;
            color: #f2f2f7;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #f2f2f7;
            font-weight: 600;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #8e8e93;
            margin-bottom: 10px;
        }

        /* Count picker */
        .count-picker {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .count-btn {
            width: 38px;
            height: 38px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #f2f2f7;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .count-btn:hover { background: #3a3a3c; }

        .count-btn.active {
            background: #f2f2f7;
            color: #1c1c1e;
            border-color: #f2f2f7;
            font-weight: 600;
        }

        /* Pattern picker */
        #pattern-section { margin-bottom: 24px; display: none; }

        .pattern-list { display: flex; gap: 10px; flex-wrap: wrap; }

        .pattern-thumb {
            cursor: pointer;
            border: 2px solid #3a3a3c;
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .pattern-thumb:hover { border-color: #8e8e93; }
        .pattern-thumb.active { border-color: #f2f2f7; }

        .pattern-thumb span {
            font-size: 10px;
            color: #8e8e93;
        }

        .pattern-thumb.active span { color: #f2f2f7; }

        /* Composition */
        #composition-wrapper {
            display: inline-block;
            border: 5px solid white;
        }

        #composition {
            position: relative;
            width: 600px;
            height: 600px;
            background: #2c2c2e;
            overflow: hidden;
        }

        .frame {
            position: absolute;
            border-style: solid;
            border-color: white;
            border-width: 0;
            cursor: pointer;
            overflow: hidden;
            background-color: #d0d0d0;
            background-image:
                linear-gradient(45deg, #a8a8a8 25%, transparent 25%),
                linear-gradient(-45deg, #a8a8a8 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #a8a8a8 75%),
                linear-gradient(-45deg, transparent 75%, #a8a8a8 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        .frame.selected::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid rgba(10, 132, 255, 0.4);
            background: rgba(10, 132, 255, 0.04);
            pointer-events: none;
            z-index: 1;
        }

        .frame-image {
            position: absolute;
            inset: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform-origin: center center;
        }

        /* Frame settings panel */
        #frame-settings {
            display: none;
            width: 280px;
            background: #2c2c2e;
            border-radius: 8px;
            padding: 14px 16px;
            gap: 12px;
            flex-direction: column;
            flex-shrink: 0;
        }

        #frame-settings.visible { display: flex; }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-row span:first-child {
            font-size: 12px;
            color: #8e8e93;
            width: 80px;
            flex-shrink: 0;
        }

        .setting-row input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: #0a84ff;
        }

        .setting-row .value {
            font-size: 12px;
            color: #f2f2f7;
            width: 36px;
            text-align: right;
            flex-shrink: 0;
        }

        .setting-row input[type="number"] {
            width: 52px;
            background: #3a3a3c;
            border: 1px solid #48484a;
            border-radius: 4px;
            color: #f2f2f7;
            font-size: 12px;
            font-family: inherit;
            padding: 2px 6px;
            text-align: right;
            flex-shrink: 0;
            -moz-appearance: textfield;
        }

        .setting-row input[type="number"]::-webkit-inner-spin-button,
        .setting-row input[type="number"]::-webkit-outer-spin-button {
            opacity: 0;
        }

        .setting-row input[type="number"]:focus {
            outline: none;
            border-color: #0a84ff;
        }

        .setting-actions {
            display: flex;
            gap: 8px;
            padding-top: 4px;
        }

        .setting-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #3a3a3c;
            background: #3a3a3c;
            color: #f2f2f7;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .setting-btn:hover { background: #48484a; }

        .setting-btn.danger { border-color: #ff453a; color: #ff453a; background: none; }
        .setting-btn.danger:hover { background: rgba(255, 69, 58, 0.1); }

        /* Actions */
        .actions { display: flex; gap: 12px; align-items: center; }

        #file { display: none; }

        .file-label {
            display: inline-block;
            padding: 8px 16px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            color: #f2f2f7;
        }

        .file-label:hover { background: #3a3a3c; }

        #save {
            padding: 8px 20px;
            background: #f2f2f7;
            color: #1c1c1e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
        }

        /* Sections hidden until pattern is selected */
        #photo-section,
        #grid-controls,
        #export-section,
        #composition-wrapper,
        #pattern-section { display: none; }

        #photo-section { margin-bottom: 24px; }
        #grid-controls { margin-bottom: 16px; }

        #grid-controls .setting-row { width: 600px; }

        #pattern-section.visible,
        #photo-section.visible,
        #grid-controls.visible,
        #export-section.visible { display: block; }

        #composition-wrapper.visible { display: inline-block; }

        /* Composition + frame settings side by side */
        #composition-area {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        /* Export section */
        #export-section { display: none; margin-bottom: 16px; }

        #export-row {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .res-picker { display: flex; gap: 6px; }

        .res-btn {
            padding: 0 14px;
            height: 38px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #f2f2f7;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        .res-btn:hover { background: #3a3a3c; }

        .res-btn.active {
            background: #f2f2f7;
            color: #1c1c1e;
            border-color: #f2f2f7;
            font-weight: 600;
        }

        #save {
            appearance: none;
            -webkit-appearance: none;
            display: inline-block;
            padding: 8px 16px;
            background: #2c2c2e;
            color: #f2f2f7;
            border: 1px solid #3a3a3c;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: normal;
        }

        #save:hover { background: #3a3a3c; }

        #save:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Export overlay */
        #export-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        #export-overlay.visible { display: flex; }

        .export-card {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 28px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .export-card p {
            margin: 0;
            font-size: 14px;
            color: #f2f2f7;
        }

        .progress-track {
            width: 220px;
            height: 4px;
            background: #3a3a3c;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-track::after {
            content: '';
            display: block;
            width: 45%;
            height: 100%;
            background: #0a84ff;
            border-radius: 2px;
            animation: progress-slide 1.2s ease-in-out infinite;
        }

        @keyframes progress-slide {
            0%   { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }
    </style>
</head>
<body>
    <h1>Photo Comp</h1>

    <div class="label">Number of photos</div>
    <div class="count-picker" id="count-picker"></div>

    <div id="pattern-section">
        <div class="label">Layout</div>
        <div class="pattern-list" id="pattern-list"></div>
    </div>

    <div id="photo-section">
        <div class="label">Photos</div>
        <label class="file-label" id="file-label" for="file">Choose photos</label>
        <input type="file" id="file" accept="image/jpeg,image/png" multiple>
    </div>

    <div id="grid-controls">
        <div class="label">Grid</div>
        <div class="setting-row">
            <span>Line width</span>
            <input type="range" id="border-slider" min="0" max="30" value="5" step="1">
            <input type="number" id="border-value" min="0" max="30" value="5" step="1">
        </div>
        <div class="setting-row">
            <span>Outer border</span>
            <input type="range" id="outer-border-slider" min="0" max="30" value="5" step="1">
            <input type="number" id="outer-border-value" min="0" max="30" value="5" step="1">
        </div>
    </div>

    <div id="composition-area">
        <div id="composition-wrapper">
            <div id="composition"></div>
        </div>

        <div id="frame-settings">
            <div class="setting-row">
                <span>Zoom</span>
                <input type="range" id="zoom-slider" min="100" max="300" value="100" step="1">
                <input type="number" id="zoom-value" min="100" max="300" value="100" step="1">
            </div>
            <div class="setting-row">
                <span>Horizontal</span>
                <input type="range" id="x-slider" min="-50" max="50" value="0" step="1">
                <input type="number" id="x-value" min="-50" max="50" value="0" step="1">
            </div>
            <div class="setting-row">
                <span>Vertical</span>
                <input type="range" id="y-slider" min="-50" max="50" value="0" step="1">
                <input type="number" id="y-value" min="-50" max="50" value="0" step="1">
            </div>
            <div class="setting-actions">
                <button class="setting-btn" id="replace-btn">Replace photo</button>
                <button class="setting-btn danger" id="clear-btn">Clear</button>
            </div>
        </div>
    </div>

    <div id="export-section">
        <div class="label">Export</div>
        <div id="export-row">
            <div class="res-picker" id="res-picker"></div>
            <button id="save" disabled>Export JPEG</button>
        </div>
    </div>

    <div class="actions"></div>

    <div id="export-overlay">
        <div class="export-card">
            <p>Exporting…</p>
            <div class="progress-track"></div>
        </div>
    </div>

                        { top: 50, left: 50, width: 16.67, height: 50 },
                        { top: 50, left: 66.67, width: 16.67, height: 50 },
                        { top: 50, left: 83.33, width: 16.67, height: 50 },
                    ]
                },
            ],
            10: [
                {
                    id: '10-5x2', name: '5×2 grid',
                    frames: [
                        { top: 0, left: 0, width: 20, height: 50 },
                        { top: 0, left: 20, width: 20, height: 50 },
                        { top: 0, left: 40, width: 20, height: 50 },
                        { top: 0, left: 60, width: 20, height: 50 },
                        { top: 0, left: 80, width: 20, height: 50 },
                        { top: 50, left: 0, width: 20, height: 50 },
                        { top: 50, left: 20, width: 20, height: 50 },
                        { top: 50, left: 40, width: 20, height: 50 },
                        { top: 50, left: 60, width: 20, height: 50 },
                        { top: 50, left: 80, width: 20, height: 50 },
                    ]
                },
                {
                    id: '10-2x5', name: '2×5 grid',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 20 },
                        { top: 0, left: 50, width: 50, height: 20 },
                        { top: 20, left: 0, width: 50, height: 20 },
                        { top: 20, left: 50, width: 50, height: 20 },
                        { top: 40, left: 0, width: 50, height: 20 },
                        { top: 40, left: 50, width: 50, height: 20 },
                        { top: 60, left: 0, width: 50, height: 20 },
                        { top: 60, left: 50, width: 50, height: 20 },
                        { top: 80, left: 0, width: 50, height: 20 },
                        { top: 80, left: 50, width: 50, height: 20 },
                    ]
                },
                {
                    id: '10-4top-6bottom', name: '4 top + 6 bottom',
                    frames: [
                        { top: 0, left: 0, width: 25, height: 50 },
                        { top: 0, left: 25, width: 25, height: 50 },
                        { top: 0, left: 50, width: 25, height: 50 },
                        { top: 0, left: 75, width: 25, height: 50 },
                        { top: 50, left: 0, width: 16.67, height: 50 },
                        { top: 50, left: 16.67, width: 16.67, height: 50 },
                        { top: 50, left: 33.33, width: 16.67, height: 50 },
                        { top: 50, left: 50, width: 16.67, height: 50 },
                        { top: 50, left: 66.67, width: 16.67, height: 50 },
                        { top: 50, left: 83.33, width: 16.67, height: 50 },
                    ]
                },
            ],
        };

        let currentPattern = null;
        let loadedImages = [];
        let frameAdjustments = {};
        let selectedFrameIndex = null;
        let borderWidth = 5;
        let outerBorderWidth = 5;
        let exportResolution = 4000;

        function init() {
            const countPicker = document.getElementById('count-picker');
            for (let n = 2; n <= 10; n++) {
                const btn = document.createElement('button');
                btn.className = 'count-btn';
                btn.textContent = n;
                btn.dataset.count = n;
                btn.addEventListener('click', () => selectCount(n));
                countPicker.appendChild(btn);
            }

            const resPicker = document.getElementById('res-picker');
            RESOLUTIONS.forEach(res => {
                const btn = document.createElement('button');
                btn.className = 'res-btn' + (res.value === exportResolution ? ' active' : '');
                btn.textContent = res.label;
                btn.addEventListener('click', () => {
                    exportResolution = res.value;
                    document.querySelectorAll('.res-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
                resPicker.appendChild(btn);
            });

            document.getElementById('file').addEventListener('change', onFileChange);
            document.getElementById('save').addEventListener('click', saveToJpg);
            document.addEventListener('click', deselectAll);

            document.getElementById('zoom-slider').addEventListener('input', function () {
                if (selectedFrameIndex === null) return;
                frameAdjustments[selectedFrameIndex].zoom = Number(this.value) / 100;
                document.getElementById('zoom-value').value = this.value;
                applyFrameAdjustment(selectedFrameIndex);
            });

            document.getElementById('zoom-value').addEventListener('input', function () {
                if (selectedFrameIndex === null) return;
                const val = Math.min(300, Math.max(100, Number(this.value) || 100));
                frameAdjustments[selectedFrameIndex].zoom = val / 100;
                document.getElementById('zoom-slider').value = val;
                applyFrameAdjustment(selectedFrameIndex);
            });

            document.getElementById('x-slider').addEventListener('input', function () {
                if (selectedFrameIndex === null) return;
                frameAdjustments[selectedFrameIndex].x = Number(this.value);
                document.getElementById('x-value').value = this.value;
                applyFrameAdjustment(selectedFrameIndex);
            });

            document.getElementById('x-value').addEventListener('input', function () {
                if (selectedFrameIndex === null) return;
                const val = Math.min(50, Math.max(-50, Number(this.value) || 0));
                frameAdjustments[selectedFrameIndex].x = val;
                document.getElementById('x-slider').value = val;
                applyFrameAdjustment(selectedFrameIndex);
            });

            document.getElementById('y-slider').addEventListener('input', function () {
                if (selectedFrameIndex === null) return;
                frameAdjustments[selectedFrameIndex].y = Number(this.value);
                document.getElementById('y-value').value = this.value;
                applyFrameAdjustment(selectedFrameIndex);
            });

            document.getElementById('y-value').addEventListener('input', function () {
                if (selectedFrameIndex === null) return;
                const val = Math.min(50, Math.max(-50, Number(this.value) || 0));
                frameAdjustments[selectedFrameIndex].y = val;
                document.getElementById('y-slider').value = val;
                applyFrameAdjustment(selectedFrameIndex);
            });

            document.getElementById('replace-btn').addEventListener('click', () => {
                if (selectedFrameIndex !== null) replaceFrame(selectedFrameIndex);
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                if (selectedFrameIndex !== null) clearFrame(selectedFrameIndex);
            });

            document.getElementById('frame-settings').addEventListener('click', e => e.stopPropagation());

            document.getElementById('border-slider').addEventListener('input', function () {
                borderWidth = Number(this.value);
                document.getElementById('border-value').value = borderWidth;
                updateFrameBorders();
            });

            document.getElementById('border-value').addEventListener('input', function () {
                borderWidth = Math.min(30, Math.max(0, Number(this.value) || 0));
                document.getElementById('border-slider').value = borderWidth;
                updateFrameBorders();
            });

            document.getElementById('outer-border-slider').addEventListener('input', function () {
                outerBorderWidth = Number(this.value);
                document.getElementById('outer-border-value').value = outerBorderWidth;
                updateFrameBorders();
            });

            document.getElementById('outer-border-value').addEventListener('input', function () {
                outerBorderWidth = Math.min(30, Math.max(0, Number(this.value) || 0));
                document.getElementById('outer-border-slider').value = outerBorderWidth;
                updateFrameBorders();
            });
        }

        function selectCount(n) {
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.classList.toggle('active', Number(btn.dataset.count) === n);
            });
            renderPatternPicker(n);
            document.getElementById('pattern-section').classList.add('visible');
        }

        function renderPatternPicker(count) {
            const list = document.getElementById('pattern-list');
            list.innerHTML = '';
            currentPattern = null;

            GRID_PATTERNS[count].forEach(pattern => {
                const thumb = document.createElement('div');
                thumb.className = 'pattern-thumb';
                thumb.dataset.patternId = pattern.id;

                thumb.appendChild(createPatternSvg(pattern.frames));

                const label = document.createElement('span');
                label.textContent = pattern.name;
                thumb.appendChild(label);

                thumb.addEventListener('click', () => selectPattern(count, pattern.id));
                list.appendChild(thumb);
            });
        }

        function selectPattern(count, patternId) {
            currentPattern = GRID_PATTERNS[count].find(p => p.id === patternId);

            document.querySelectorAll('.pattern-thumb').forEach(thumb => {
                thumb.classList.toggle('active', thumb.dataset.patternId === patternId);
            });

            applyPattern(currentPattern);
        }

        function createPatternSvg(frames) {
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('width', THUMB_W);
            svg.setAttribute('height', THUMB_H);
            svg.setAttribute('viewBox', '0 0 500 500');

            const bg = document.createElementNS(ns, 'rect');
            bg.setAttribute('width', '500');
            bg.setAttribute('height', '500');
            bg.setAttribute('fill', '#3a3a3c');
            svg.appendChild(bg);

            frames.forEach(f => {
                const rect = document.createElementNS(ns, 'rect');
                rect.setAttribute('x', f.left / 100 * 500);
                rect.setAttribute('y', f.top / 100 * 500);
                rect.setAttribute('width', f.width / 100 * 500);
                rect.setAttribute('height', f.height / 100 * 500);
                rect.setAttribute('fill', '#6e6e73');
                rect.setAttribute('stroke', '#1c1c1e');
                rect.setAttribute('stroke-width', '12');
                svg.appendChild(rect);
            });

            return svg;
        }

        function applyPattern(pattern) {
            const composition = document.getElementById('composition');
            composition.innerHTML = '';
            frameAdjustments = {};
            deselectAll();

            pattern.frames.forEach((f, i) => {
                frameAdjustments[i] = { zoom: 1, x: 0, y: 0 };

                const frame = document.createElement('div');
                frame.className = 'frame';
                frame.id = `frame-${i}`;
                frame.style.top = `${f.top}%`;
                frame.style.left = `${f.left}%`;
                frame.style.width = `${f.width}%`;
                frame.style.height = `${f.height}%`;

                const image = document.createElement('div');
                image.className = 'frame-image';
                frame.appendChild(image);

                frame.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isSelected = frame.classList.contains('selected');
                    deselectAll();
                    if (!isSelected) selectFrame(i);
                });

                composition.appendChild(frame);
            });

            renderFrames(loadedImages);
            updateFrameBorders();

            document.getElementById('composition-wrapper').classList.add('visible');
            document.getElementById('photo-section').classList.add('visible');
            document.getElementById('grid-controls').classList.add('visible');
            document.getElementById('export-section').classList.add('visible');
        }

        function onFileChange() {
            const files = Array.from(this.files).filter(file => {
                if (!ACCEPTED_TYPES.includes(file.type)) {
                    alert(`Invalid file type: ${file.name}`);
                    return false;
                }
                return true;
            });

            if (!files.length) return;

            const emptySlots = getEmptySlots();
            if (!emptySlots.length) return;

            loadImages(files.slice(0, emptySlots.length))
                .then(images => {
                    images.forEach((src, i) => {
                        loadedImages[emptySlots[i]] = src;
                    });
                    renderFrames(loadedImages);
                    document.getElementById('save').disabled = false;
                })
                .catch(err => {
                    console.error('Failed to load images:', err);
                    alert('Failed to load one or more images.');
                });
        }

        function getEmptySlots() {
            const slots = [];
            for (let i = 0; i < currentPattern.frames.length; i++) {
                if (!loadedImages[i]) slots.push(i);
            }
            return slots;
        }

        function getOuterSides(f) {
            return {
                top:    f.top < 0.1,
                left:   f.left < 0.1,
                bottom: (f.top + f.height) > 99.9,
                right:  (f.left + f.width) > 99.9,
            };
        }

        function updateFrameBorders(innerW = borderWidth, outerW = outerBorderWidth, container = document) {
            if (!currentPattern) return;
            const wrapper = container === document
                ? document.getElementById('composition-wrapper')
                : container;
            currentPattern.frames.forEach((f, i) => {
                const frame = wrapper.querySelector(`#frame-${i}`);
                if (!frame) return;
                const outer = getOuterSides(f);
                frame.style.borderTopWidth    = outer.top    ? '0' : `${innerW}px`;
                frame.style.borderLeftWidth   = outer.left   ? '0' : `${innerW}px`;
                frame.style.borderBottomWidth = outer.bottom ? '0' : `${innerW}px`;
                frame.style.borderRightWidth  = outer.right  ? '0' : `${innerW}px`;
            });
            wrapper.style.borderWidth = `${outerW}px`;
        }

        function selectFrame(i) {
            selectedFrameIndex = i;
            document.getElementById(`frame-${i}`).classList.add('selected');

            const adj = frameAdjustments[i];
            const zoomPct = Math.round(adj.zoom * 100);
            document.getElementById('zoom-slider').value = zoomPct;
            document.getElementById('zoom-value').value = zoomPct;
            document.getElementById('x-slider').value = adj.x;
            document.getElementById('x-value').value = adj.x;
            document.getElementById('y-slider').value = adj.y;
            document.getElementById('y-value').value = adj.y;

            document.getElementById('frame-settings').classList.add('visible');
        }

        function deselectAll() {
            selectedFrameIndex = null;
            document.querySelectorAll('.frame.selected').forEach(f => f.classList.remove('selected'));
            document.getElementById('frame-settings').classList.remove('visible');
        }

        function applyFrameAdjustment(i) {
            const image = document.querySelector(`#frame-${i} .frame-image`);
            if (!image) return;
            const { zoom, x, y } = frameAdjustments[i];
            image.style.transform = `scale(${zoom}) translate(${x}%, ${y}%)`;
        }

        function clearFrame(i) {
            loadedImages[i] = null;
            frameAdjustments[i] = { zoom: 1, x: 0, y: 0 };
            const image = document.querySelector(`#frame-${i} .frame-image`);
            if (image) {
                image.style.backgroundImage = '';
                image.style.transform = '';
            }
            deselectAll();
        }

        function replaceFrame(i) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/jpeg,image/png';
            input.addEventListener('change', function () {
                const file = this.files[0];
                if (!file || !ACCEPTED_TYPES.includes(file.type)) return;
                loadImages([file])
                    .then(([src]) => {
                        loadedImages[i] = src;
                        frameAdjustments[i] = { zoom: 1, x: 0, y: 0 };
                        renderFrames(loadedImages);
                        applyFrameAdjustment(i);
                        selectFrame(i);
                    })
                    .catch(err => console.error('Failed to replace image:', err));
            });
            input.click();
        }

        function loadImages(files) {
            const promises = files.map(file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = () => reject(new Error(`Failed to read: ${file.name}`));
                reader.readAsDataURL(file);
            }));
            return Promise.all(promises);
        }

        function renderFrames(images) {
            if (!currentPattern) return;
            images.forEach((src, i) => {
                const image = document.querySelector(`#frame-${i} .frame-image`);
                if (!image) return;
                image.style.backgroundImage = src ? `url(${src})` : '';
            });
        }

        function generateFilename() {
            const now = new Date();
            const date = now.toLocaleDateString('en-CA'); // YYYY-MM-DD
            const time = now.toTimeString().slice(0, 8).replace(/:/g, '-'); // HH-MM-SS
            const res = RESOLUTIONS.find(r => r.value === exportResolution)?.label ?? `${exportResolution}px`;
            return `PhotoComp_${date}_${time}_${res}.jpeg`;
        }

        function saveToJpg() {
            document.getElementById('export-overlay').classList.add('visible');

            const scale = exportResolution / 600;
            const scaledBorder = Math.round(borderWidth * scale);
            const scaledOuterBorder = Math.round(outerBorderWidth * scale);
            const exportTotal = exportResolution + 2 * scaledOuterBorder;

            const imagePromises = loadedImages.map(src => {
                if (!src) return Promise.resolve(null);
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = src;
                });
            });

            Promise.all(imagePromises)
                .then(images => {
                    const canvas = document.createElement('canvas');
                    canvas.width = exportTotal;
                    canvas.height = exportTotal;
                    const ctx = canvas.getContext('2d');

                    // White base — covers outer border + inner grid lines
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, exportTotal, exportTotal);

                    currentPattern.frames.forEach((f, i) => {
                        const outer = getOuterSides(f);

                        const fx = scaledOuterBorder + f.left / 100 * exportResolution;
                        const fy = scaledOuterBorder + f.top / 100 * exportResolution;
                        const fw = f.width / 100 * exportResolution;
                        const fh = f.height / 100 * exportResolution;

                        const bT = outer.top    ? 0 : scaledBorder;
                        const bL = outer.left   ? 0 : scaledBorder;
                        const bR = outer.right  ? 0 : scaledBorder;
                        const bB = outer.bottom ? 0 : scaledBorder;

                        const innerX = fx + bL;
                        const innerY = fy + bT;
                        const innerW = fw - bL - bR;
                        const innerH = fh - bT - bB;

                        ctx.fillStyle = 'white';
                        ctx.fillRect(innerX, innerY, innerW, innerH);

                        const img = images[i];
                        if (!img) return;

                        const adj = frameAdjustments[i] || { zoom: 1, x: 0, y: 0 };

                        // Replicate background-size: contain
                        const containScale = Math.min(innerW / img.naturalWidth, innerH / img.naturalHeight);
                        const renderedW = img.naturalWidth * containScale;
                        const renderedH = img.naturalHeight * containScale;
                        const cx = (innerW - renderedW) / 2;
                        const cy = (innerH - renderedH) / 2;

                        // Replicate transform: scale(zoom) translate(x%, y%)
                        const zoom = adj.zoom;
                        const finalW = renderedW * zoom;
                        const finalH = renderedH * zoom;
                        const finalX = innerW / 2 + (cx - innerW / 2) * zoom + innerW * adj.x / 100;
                        const finalY = innerH / 2 + (cy - innerH / 2) * zoom + innerH * adj.y / 100;

                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(innerX, innerY, innerW, innerH);
                        ctx.clip();
                        ctx.drawImage(img, innerX + finalX, innerY + finalY, finalW, finalH);
                        ctx.restore();
                    });

                    const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
                    const link = document.createElement('a');
                    link.download = generateFilename();
                    link.href = dataUrl;
                    link.click();
                })
                .catch(err => {
                    console.error('Export failed:', err);
                    alert('Export failed. See console for details.');
                })
                .finally(() => {
                    document.getElementById('export-overlay').classList.remove('visible');
                });
        }

        init();
    </script>
</body>
