<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PhotoComp</title>
        <style>
            html, body {
                margin: 0 auto;
                padding: 0;
                border: none;
            }

            #composition {
                position: relative;
                width: 800px;
                height: 500px;
                background-color: grey;
            }

            .frame {
                position: absolute;
                box-sizing: border-box;
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center center;
            }

            #frame-0 {
                top: 0;
                left: 0;
                width: 50%;
                height: 50%;
                border: 5px solid white;
            }

            #frame-1 {
                top: 50%;
                left: 0;
                width: 50%;
                height: 50%;
                border: 5px solid white;
            }

            #frame-2 {
                top: 0;
                left: 50%;
                width: 50%;
                height: 100%;
                border: 5px solid white;
            }
        </style>
        <script src="libs/dom-to-image.min.js"></script>
    </head>
    <body>
        <h1>PhotoComp</h1>
        <div id="composition">
            <div class="frame" id="frame-0"></div>
            <div class="frame" id="frame-1"></div>
            <div class="frame" id="frame-2"></div>
        </div>
        <br>
        <input type="file" id="file" accept="image/jpeg,image/png" multiple>
        <br>
        <button type="button" id="save">Save</button>

        <script>
            const EXPORT_WIDTH = 8000;
            const EXPORT_HEIGHT = 5000;
            const ACCEPTED_TYPES = ['image/jpeg', 'image/png', 'image/jpg'];

            document.getElementById('file').addEventListener('change', function () {
                const files = Array.from(this.files).filter(file => {
                    if (!ACCEPTED_TYPES.includes(file.type)) {
                        alert(`Invalid file type: ${file.name}`);
                        return false;
                    }
                    return true;
                });

                if (!files.length) return;

                loadImages(files).then(renderFrames);
            });

            document.getElementById('save').addEventListener('click', saveToJpg);

            function loadImages(files) {
                const promises = files.map(file => new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = () => reject(new Error(`Failed to read file: ${file.name}`));
                    reader.readAsDataURL(file);
                }));

                return Promise.all(promises);
            }

            function renderFrames(imagePaths) {
                imagePaths.forEach((src, i) => {
                    const frame = document.getElementById(`frame-${i}`);
                    if (frame) {
                        frame.style.backgroundImage = `url(${src})`;
                    }
                });
            }

            function saveToJpg() {
                const composition = document.getElementById('composition');

                composition.style.width = `${EXPORT_WIDTH}px`;
                composition.style.height = `${EXPORT_HEIGHT}px`;

                domtoimage.toJpeg(composition, { quality: 1, width: EXPORT_WIDTH, height: EXPORT_HEIGHT })
                    .then(dataUrl => {
                        const link = document.createElement('a');
                        link.download = 'composition.jpeg';
                        link.href = dataUrl;
                        link.click();
                    })
                    .catch(err => {
                        console.error('Export failed:', err);
                        alert('Export failed. See console for details.');
                    })
                    .finally(() => {
                        composition.style.width = '800px';
                        composition.style.height = '500px';
                    });
            }
        </script>
    </body>
</html>
