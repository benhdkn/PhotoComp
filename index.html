<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhotoComp</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, sans-serif;
            background: #1c1c1e;
            color: #f2f2f7;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #f2f2f7;
            font-weight: 600;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #8e8e93;
            margin-bottom: 10px;
        }

        /* Count picker */
        .count-picker {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .count-btn {
            width: 38px;
            height: 38px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #f2f2f7;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .count-btn:hover { background: #3a3a3c; }

        .count-btn.active {
            background: #f2f2f7;
            color: #1c1c1e;
            border-color: #f2f2f7;
            font-weight: 600;
        }

        /* Pattern picker */
        #pattern-section { margin-bottom: 24px; display: none; }

        .pattern-list { display: flex; gap: 10px; flex-wrap: wrap; }

        .pattern-thumb {
            cursor: pointer;
            border: 2px solid #3a3a3c;
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .pattern-thumb:hover { border-color: #8e8e93; }
        .pattern-thumb.active { border-color: #f2f2f7; }

        .pattern-thumb span {
            font-size: 10px;
            color: #8e8e93;
        }

        .pattern-thumb.active span { color: #f2f2f7; }

        /* Composition */
        /* The outer border is white padding; clipping here keeps shadows inside the comp */
        #composition-wrapper {
            display: inline-block;
            padding: 5px;
            background: white;
            overflow: hidden;
        }

        #composition {
            position: relative;
            width: 600px;
            height: 600px;
            background: white;
        }

        .frame {
            position: absolute;
            border-style: solid;
            border-color: transparent;
            border-width: 0;
            cursor: pointer;
        }

        /* Rounded photo area inside the frame's border; the white frame background shows in the corners */
        .frame-inner {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: var(--corner-radius, 0);
            background-color: #d0d0d0;
            background-image:
                linear-gradient(45deg, #a8a8a8 25%, transparent 25%),
                linear-gradient(-45deg, #a8a8a8 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #a8a8a8 75%),
                linear-gradient(-45deg, transparent 75%, #a8a8a8 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        .frame.selected::after,
        .frame.drop-target::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 4px solid #30d158;
            border-radius: var(--corner-radius, 0);
            background: rgba(48, 209, 88, 0.08);
            pointer-events: none;
            z-index: 2;
        }

        /* Drag and drop to swap photos */
        .frame.drop-target::after {
            border-style: dashed;
            background: rgba(48, 209, 88, 0.2);
        }

        .frame.dragging { opacity: 0.4; }

        /* Draggable lines between cells */
        .edge-handle {
            position: absolute;
            z-index: 2;
            touch-action: none;
        }

        .edge-handle.vertical { width: 14px; margin-left: -7px; cursor: col-resize; }
        .edge-handle.horizontal { height: 14px; margin-top: -7px; cursor: row-resize; }

        .edge-handle::before {
            content: '';
            position: absolute;
            background: #30d158;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .edge-handle.vertical::before { top: 0; bottom: 0; left: 6px; width: 2px; }
        .edge-handle.horizontal::before { left: 0; right: 0; top: 6px; height: 2px; }

        .edge-handle:hover::before,
        .edge-handle.active::before { opacity: 1; }

        /* Inner shadow, drawn above the photo: black shapes just outside the photo area
           (hidden by its clipping) cast a drop shadow inward. One mitred strip per side,
           plus the bits between a rounded corner and the square corner when both sides are on. */
        .inner-shadow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            filter: var(--inner-shadow, none);
        }

        .caster { position: absolute; background: black; }

        .caster-top    { left: -60px; right: -60px; top: -60px; height: 60px;
                         clip-path: polygon(0 0, 100% 0, calc(100% - 60px) 100%, 60px 100%); }
        .caster-bottom { left: -60px; right: -60px; bottom: -60px; height: 60px;
                         clip-path: polygon(60px 0, calc(100% - 60px) 0, 100% 100%, 0 100%); }
        .caster-left   { top: -60px; bottom: -60px; left: -60px; width: 60px;
                         clip-path: polygon(0 0, 100% 60px, 100% calc(100% - 60px), 0 100%); }
        .caster-right  { top: -60px; bottom: -60px; right: -60px; width: 60px;
                         clip-path: polygon(0 60px, 100% 0, 100% 100%, 0 calc(100% - 60px)); }

        .fillet { width: var(--corner-radius, 0); height: var(--corner-radius, 0); background: none; }
        .fillet-tl { left: 0; top: 0;
                     background: radial-gradient(circle var(--corner-radius, 0) at 100% 100%, transparent 99%, black 100%); }
        .fillet-tr { right: 0; top: 0;
                     background: radial-gradient(circle var(--corner-radius, 0) at 0 100%, transparent 99%, black 100%); }
        .fillet-br { right: 0; bottom: 0;
                     background: radial-gradient(circle var(--corner-radius, 0) at 0 0, transparent 99%, black 100%); }
        .fillet-bl { left: 0; bottom: 0;
                     background: radial-gradient(circle var(--corner-radius, 0) at 100% 0, transparent 99%, black 100%); }

        .inner-off-top    :is(.caster-top, .fillet-tl, .fillet-tr),
        .inner-off-right  :is(.caster-right, .fillet-tr, .fillet-br),
        .inner-off-bottom :is(.caster-bottom, .fillet-br, .fillet-bl),
        .inner-off-left   :is(.caster-left, .fillet-bl, .fillet-tl) { display: none; }

        /* Outer shadow: drawn below every photo (z-index), so it spreads across the lines
           and blends with the neighbours' shadows without darkening other photos.
           Clipped to the enabled sides, mitred at the corners. */
        .outer-shadow {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: var(--corner-radius, 0);
            box-shadow: var(--outer-shadow, none);
            clip-path: var(--outer-shadow-clip, none);
            pointer-events: none;
        }

        .frame-inner { z-index: 1; }

        /* Shadow side toggles */
        .side-toggles {
            display: flex;
            gap: 4px;
            margin: 4px 0 6px 90px;
        }

        .side-btn {
            padding: 2px 8px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #8e8e93;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
        }

        .side-btn:hover { background: #3a3a3c; }

        .side-btn.active {
            background: #f2f2f7;
            color: #1c1c1e;
            border-color: #f2f2f7;
        }

        .frame-image {
            position: absolute;
            inset: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform-origin: center center;
        }

        /* Frame settings panel */
        #frame-settings {
            display: none;
            background: #2c2c2e;
            border-radius: 8px;
            padding: 14px 16px;
            gap: 12px;
            flex-direction: column;
            flex-shrink: 0;
        }

        #frame-settings.visible { display: flex; }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-row span:first-child {
            font-size: 12px;
            color: #8e8e93;
            width: 80px;
            flex-shrink: 0;
        }

        .setting-row input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: #0a84ff;
        }

        .setting-row .value {
            font-size: 12px;
            color: #f2f2f7;
            width: 36px;
            text-align: right;
            flex-shrink: 0;
        }

        .setting-row input[type="number"] {
            width: 52px;
            background: #3a3a3c;
            border: 1px solid #48484a;
            border-radius: 4px;
            color: #f2f2f7;
            font-size: 12px;
            font-family: inherit;
            padding: 2px 6px;
            text-align: right;
            flex-shrink: 0;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .setting-row input[type="number"]::-webkit-inner-spin-button,
        .setting-row input[type="number"]::-webkit-outer-spin-button {
            opacity: 0;
        }

        .setting-row input[type="number"]:focus {
            outline: none;
            border-color: #0a84ff;
        }

        .setting-actions {
            display: flex;
            gap: 8px;
            padding-top: 4px;
        }

        .setting-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #3a3a3c;
            background: #3a3a3c;
            color: #f2f2f7;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .setting-btn:hover { background: #48484a; }

        .setting-btn.danger { border-color: #ff453a; color: #ff453a; background: none; }
        .setting-btn.danger:hover { background: rgba(255, 69, 58, 0.1); }
        .setting-btn.success { border-color: #30d158; color: #30d158; background: none; }
        .setting-btn.success:hover { background: rgba(48, 209, 88, 0.1); }

        /* Actions */
        .actions { display: flex; gap: 12px; align-items: center; }

        #file { display: none; }

        .file-label {
            display: inline-block;
            padding: 8px 16px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            color: #f2f2f7;
        }

        .file-label:hover { background: #3a3a3c; }

        /* Sections hidden until pattern is selected */
        #grid-controls,
        #export-section,
        #composition-label,
        #composition-wrapper,
        #pattern-section { display: none; }

        #photo-section { margin-bottom: 24px; }
        #grid-controls { margin-bottom: 24px; }

        #pattern-section.visible,
        #grid-controls.visible,
        #export-section.visible,
        #composition-label.visible { display: block; }

        #composition-wrapper.visible { display: inline-block; }

        /* Controls on the left, composition on the right */
        #layout {
            display: flex;
            align-items: flex-start;
            gap: 40px;
        }

        #sidebar {
            width: 340px;
            flex-shrink: 0;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        /* Comp sits right after the sidebar, its label level with the first sidebar label;
           photo settings open to its right without moving it */
        #canvas-area {
            flex: 1;
            display: grid;
            grid-template-columns: auto auto;
            justify-content: start;
            align-content: start;
            column-gap: 24px;
        }

        #composition-label { grid-column: 1; grid-row: 1; }
        #composition-wrapper { grid-column: 1; grid-row: 2; }

        #frame-settings {
            grid-column: 2;
            grid-row: 2;
            align-self: start;
            width: 280px;
        }

        /* Export section */
        #export-section { display: none; margin-bottom: 24px; }

        #export-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .res-picker { display: flex; gap: 6px; }

        .res-btn {
            padding: 8px 16px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #f2f2f7;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .res-btn:hover { background: #3a3a3c; }

        .res-btn.active {
            background: #f2f2f7;
            color: #1c1c1e;
            border-color: #f2f2f7;
            font-weight: 600;
        }

        #save { padding: 8px 16px; font-size: 14px; }

        #save:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Export overlay */
        #export-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        #export-overlay.visible { display: flex; }

        .export-card {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 28px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .export-card p {
            margin: 0;
            font-size: 14px;
            color: #f2f2f7;
        }

        .progress-track {
            width: 220px;
            height: 4px;
            background: #3a3a3c;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-track::after {
            content: '';
            display: block;
            width: 45%;
            height: 100%;
            background: #0a84ff;
            border-radius: 2px;
            animation: progress-slide 1.2s ease-in-out infinite;
        }

        @keyframes progress-slide {
            0%   { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }
    </style>
</head>
<body>
    <h1>Photo Comp</h1>

    <div id="layout">
        <aside id="sidebar">
            <div id="photo-section">
                <div class="label">Photos</div>
                <label class="file-label" id="file-label" for="file">Choose photos</label>
                <input type="file" id="file" accept="image/jpeg,image/png" multiple>
            </div>

            <div class="label">Number of photos</div>
            <div class="count-picker" id="count-picker"></div>

            <div id="pattern-section">
                <div class="label">Layout</div>
                <div class="pattern-list" id="pattern-list"></div>
            </div>

            <div id="grid-controls">
                <div class="label">Grid</div>
                <div class="setting-row">
                    <span>Outer border</span>
                    <input type="range" id="outer-border-slider" min="0" max="30" value="5" step="1">
                    <input type="number" id="outer-border-value" min="0" max="30" value="5" step="1">
                </div>
                <div class="setting-row">
                    <span>Line width</span>
                    <input type="range" id="border-slider" min="0" max="30" value="5" step="1">
                    <input type="number" id="border-value" min="0" max="30" value="5" step="1">
                </div>
                <div class="setting-row">
                    <span>Corners</span>
                    <input type="range" id="corner-slider" min="0" max="50" value="0" step="1">
                    <input type="number" id="corner-value" min="0" max="50" value="0" step="1">
                </div>
                <div class="setting-row">
                    <span>Outer shadow</span>
                    <input type="range" id="shadow-slider" min="0" max="20" value="0" step="1">
                    <input type="number" id="shadow-value" min="0" max="20" value="0" step="1">
                </div>
                <div class="side-toggles" id="outer-shadow-sides">
                    <button class="side-btn active" data-side="top">Top</button>
                    <button class="side-btn active" data-side="bottom">Bottom</button>
                    <button class="side-btn active" data-side="left">Left</button>
                    <button class="side-btn active" data-side="right">Right</button>
                </div>
                <div class="setting-row">
                    <span>Inner shadow</span>
                    <input type="range" id="inner-shadow-slider" min="0" max="20" value="0" step="1">
                    <input type="number" id="inner-shadow-value" min="0" max="20" value="0" step="1">
                </div>
                <div class="side-toggles" id="inner-shadow-sides">
                    <button class="side-btn active" data-side="top">Top</button>
                    <button class="side-btn active" data-side="bottom">Bottom</button>
                    <button class="side-btn active" data-side="left">Left</button>
                    <button class="side-btn active" data-side="right">Right</button>
                </div>
            </div>

            <div id="export-section">
                <div class="label">Export</div>
                <div id="export-row">
                    <div class="res-picker" id="res-picker"></div>
                    <button id="save" class="setting-btn success" disabled>Export JPEG</button>
                </div>
            </div>

            <div class="actions"></div>
        </aside>

        <main id="canvas-area">
            <div class="label" id="composition-label">Composition</div>
            <div id="composition-wrapper">
                <div id="composition"></div>
            </div>

            <div id="frame-settings">
                <div class="label">Selected photo</div>
                <div class="setting-actions">
                    <button class="setting-btn" id="fit-btn">Auto fit</button>
                </div>
                <div class="setting-row">
                    <span>Zoom</span>
                    <input type="range" id="zoom-slider" min="100" max="300" value="100" step="1">
                    <input type="number" id="zoom-value" min="100" max="300" value="100" step="1">
                </div>
                <div class="setting-row">
                    <span>Horizontal</span>
                    <input type="range" id="x-slider" min="-50" max="50" value="0" step="1">
                    <input type="number" id="x-value" min="-50" max="50" value="0" step="1">
                </div>
                <div class="setting-row">
                    <span>Vertical</span>
                    <input type="range" id="y-slider" min="-50" max="50" value="0" step="1">
                    <input type="number" id="y-value" min="-50" max="50" value="0" step="1">
                </div>
                <div class="setting-actions">
                    <button class="setting-btn" id="replace-btn">Replace photo</button>
                    <button class="setting-btn danger" id="clear-btn">Clear</button>
                </div>
            </div>
        </main>
    </div>

    <div id="export-overlay">
        <div class="export-card">
            <p>Exporting…</p>
            <div class="progress-track"></div>
        </div>
    </div>

    <script>
        const RESOLUTIONS = [
            { label: '1K', value: 1000 },
            { label: '2K', value: 2000 },
            { label: '3K', value: 3000 },
            { label: '4K', value: 4000 },
        ];
        const THUMB_W = 60;
        const THUMB_H = 60;
        const ACCEPTED_TYPES = ['image/jpeg', 'image/png', 'image/jpg'];

        const GRID_PATTERNS = {
            2: [
                {
                    id: '2-cols', name: 'Side by side',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 50, height: 100 },
                    ]
                },
                {
                    id: '2-rows', name: 'Stacked',
                    frames: [
                        { top: 0, left: 0, width: 100, height: 50 },
                        { top: 50, left: 0, width: 100, height: 50 },
                    ]
                },
            ],
            3: [
                {
                    id: '3-1left-2right', name: '1 left + 2 right',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 50, width: 50, height: 50 },
                    ]
                },
                {
                    id: '3-2left-1right', name: '2 left + 1 right',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 50, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 100 },
                    ]
                },
                {
                    id: '3-cols', name: '3 columns',
                    frames: [
                        { top: 0, left: 0, width: 33.33, height: 100 },
                        { top: 0, left: 33.33, width: 33.34, height: 100 },
                        { top: 0, left: 66.67, width: 33.33, height: 100 },
                    ]
                },
                {
                    id: '3-2top-1bottom', name: '2 top + 1 bottom',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 0, width: 100, height: 50 },
                    ]
                },
            ],
            4: [
                {
                    id: '4-2x2', name: '2×2 grid',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 0, width: 50, height: 50 },
                        { top: 50, left: 50, width: 50, height: 50 },
                    ]
                },
                {
                    id: '4-1left-3right', name: '1 left + 3 right',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 50, height: 33.33 },
                        { top: 33.33, left: 50, width: 50, height: 33.34 },
                        { top: 66.67, left: 50, width: 50, height: 33.33 },
                    ]
                },
                {
                    id: '4-3left-1right', name: '3 left + 1 right',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 33.33 },
                        { top: 33.33, left: 0, width: 50, height: 33.34 },
                        { top: 66.67, left: 0, width: 50, height: 33.33 },
                        { top: 0, left: 50, width: 50, height: 100 },
                    ]
                },
                {
                    id: '4-1top-3bottom', name: '1 top + 3 bottom',
                    frames: [
                        { top: 0, left: 0, width: 100, height: 50 },
                        { top: 50, left: 0, width: 33.33, height: 50 },
                        { top: 50, left: 33.33, width: 33.34, height: 50 },
                        { top: 50, left: 66.67, width: 33.33, height: 50 },
                    ]
                },
            ],
            5: [
                {
                    id: '5-2top-3bottom', name: '2 top + 3 bottom',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 50 },
                        { top: 0, left: 50, width: 50, height: 50 },
                        { top: 50, left: 0, width: 33.33, height: 50 },
                        { top: 50, left: 33.33, width: 33.34, height: 50 },
                        { top: 50, left: 66.67, width: 33.33, height: 50 },
                    ]
                },
                {
                    id: '5-3top-2bottom', name: '3 top + 2 bottom',
                    frames: [
                        { top: 0, left: 0, width: 33.33, height: 50 },
                        { top: 0, left: 33.33, width: 33.34, height: 50 },
                        { top: 0, left: 66.67, width: 33.33, height: 50 },
                        { top: 50, left: 0, width: 50, height: 50 },
                        { top: 50, left: 50, width: 50, height: 50 },
                    ]
                },
                {
                    id: '5-1large-4small', name: '1 large + 4 small',
                    frames: [
                        { top: 0, left: 0, width: 50, height: 100 },
                        { top: 0, left: 50, width: 25, height: 50 },

        function createPatternSvg(frames) {
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('width', THUMB_W);
            svg.setAttribute('height', THUMB_H);
            svg.setAttribute('viewBox', '0 0 500 500');

            const bg = document.createElementNS(ns, 'rect');
            bg.setAttribute('width', '500');
            bg.setAttribute('height', '500');
            bg.setAttribute('fill', '#3a3a3c');
            svg.appendChild(bg);

            frames.forEach(f => {
                const rect = document.createElementNS(ns, 'rect');
                rect.setAttribute('x', f.left / 100 * 500);
                rect.setAttribute('y', f.top / 100 * 500);
                rect.setAttribute('width', f.width / 100 * 500);
                rect.setAttribute('height', f.height / 100 * 500);
                rect.setAttribute('fill', '#6e6e73');
                rect.setAttribute('stroke', '#1c1c1e');
                rect.setAttribute('stroke-width', '12');
                svg.appendChild(rect);
            });

            return svg;

        function positionFrame(frame, f) {
            frame.style.top = `${f.top}%`;
            frame.style.left = `${f.left}%`;
            frame.style.width = `${f.width}%`;
            frame.style.height = `${f.height}%`;
        }

        const MIN_CELL_SIZE = 5; // % of the comp
        const EDGE_AXES = [
            { orientation: 'vertical',   pos: 'left', size: 'width',  cross: 'top',  crossSize: 'height' },
            { orientation: 'horizontal', pos: 'top',  size: 'height', cross: 'left', crossSize: 'width'  },
        ];

        // Groups frame sides lying on the same straight interior line into one draggable edge
        function findEdges(frames) {
            const near = (a, b) => Math.abs(a - b) < 0.05;
            const edges = [];

            EDGE_AXES.forEach(axis => {
                const coords = [];
                frames.forEach(f => {
                    [f[axis.pos], f[axis.pos] + f[axis.size]].forEach(c => {
                        if (c > 0.1 && c < 99.9 && !coords.some(x => near(x, c))) coords.push(c);
                    });
                });

                coords.forEach(coord => {
                    const sides = [];
                    frames.forEach((f, i) => {
                        const from = f[axis.cross], to = f[axis.cross] + f[axis.crossSize];
                        if (near(f[axis.pos] + f[axis.size], coord)) sides.push({ i, isStart: false, from, to });
                        if (near(f[axis.pos], coord)) sides.push({ i, isStart: true, from, to });
                    });
                    sides.sort((a, b) => a.from - b.from);

                    // Sides that touch or overlap along the line form one continuous edge
                    let edge = null;
                    sides.forEach(s => {
                        if (edge && s.from <= edge.to + 0.05) {
                            edge.sides.push(s);
                            edge.to = Math.max(edge.to, s.to);
                        } else {
                            edge = { axis, coord, from: s.from, to: s.to, sides: [s] };
                            edges.push(edge);
                        }
                    });
                });
            });

            return edges;
        }

        function renderEdgeHandles() {
            const composition = document.getElementById('composition');
            composition.querySelectorAll('.edge-handle').forEach(h => h.remove());

            findEdges(currentPattern.frames).forEach(edge => {
                const handle = document.createElement('div');
                handle.className = `edge-handle ${edge.axis.orientation}`;
                handle.style[edge.axis.pos] = `${edge.coord}%`;
                handle.style[edge.axis.cross] = `${edge.from}%`;
                handle.style[edge.axis.crossSize] = `${edge.to - edge.from}%`;
                handle.addEventListener('pointerdown', e => startEdgeDrag(e, edge, handle));
                handle.addEventListener('click', e => e.stopPropagation());
                composition.appendChild(handle);
            });
        }

        function startEdgeDrag(e, edge, handle) {
            e.preventDefault();
            handle.setPointerCapture(e.pointerId);
            handle.classList.add('active');

            const { pos, size } = edge.axis;
            const frames = currentPattern.frames;
            // Keep every cell on both sides of the line at least MIN_CELL_SIZE
            let min = 0, max = 100;
            edge.sides.forEach(s => {
                const f = frames[s.i];
                if (s.isStart) max = Math.min(max, f[pos] + f[size] - MIN_CELL_SIZE);
                else min = Math.max(min, f[pos] + MIN_CELL_SIZE);
            });

            const rect = document.getElementById('composition').getBoundingClientRect();

            const onMove = ev => {
                const pct = edge.axis.orientation === 'vertical'
                    ? (ev.clientX - rect.left) / rect.width * 100
                    : (ev.clientY - rect.top) / rect.height * 100;
                const coord = Math.round(Math.min(max, Math.max(min, pct)) * 100) / 100;

                edge.sides.forEach(s => {
                    const f = frames[s.i];
                    if (s.isStart) {
                        f[size] = f[pos] + f[size] - coord;
                        f[pos] = coord;
                    } else {
                        f[size] = coord - f[pos];
                    }
                    positionFrame(document.getElementById(`frame-${s.i}`), f);
                });
                handle.style[pos] = `${coord}%`;
            };

            const onUp = () => {
                handle.removeEventListener('pointermove', onMove);
                handle.removeEventListener('pointerup', onUp);
                handle.removeEventListener('pointercancel', onUp);
                // Rebuild after the click that follows pointerup, so it still lands on this handle
                setTimeout(renderEdgeHandles);
            };

            handle.addEventListener('pointermove', onMove);
            handle.addEventListener('pointerup', onUp);
            handle.addEventListener('pointercancel', onUp);
        }

        function onFileChange() {

            if (!files.length) return;

            // No layout yet: use the chosen photo count, or else match the number of photos,
            // and start from that count's first layout
            if (!currentPattern) {
                const activeCount = document.querySelector('.count-btn.active');
                const count = activeCount
                    ? Number(activeCount.dataset.count)
                    : Math.min(16, Math.max(2, files.length));
                selectCount(count);
                selectPattern(count, GRID_PATTERNS[count][0].id);
            }

            const emptySlots = getEmptySlots();
            if (!emptySlots.length) return;

            loadImages(files.slice(0, emptySlots.length))
                .then(images => {
                    images.forEach((src, i) => {
                        loadedImages[emptySlots[i]] = src;
                    });
                    renderFrames(loadedImages);
                    document.getElementById('save').disabled = false;
                })
                .catch(err => {
                    console.error('Failed to load images:', err);
                    alert('Failed to load one or more images.');
                });
        }

        function getEmptySlots() {
            const slots = [];
            for (let i = 0; i < currentPattern.frames.length; i++) {
                if (!loadedImages[i]) slots.push(i);
            }
            return slots;
        }

        function getOuterSides(f) {
            return {
                top:    f.top < 0.1,
                left:   f.left < 0.1,
                bottom: (f.top + f.height) > 99.9,
                right:  (f.left + f.width) > 99.9,
            };
        }

        function updateFrameBorders(innerW = borderWidth, outerW = outerBorderWidth, container = document) {
            if (!currentPattern) return;
            const wrapper = container === document
                ? document.getElementById('composition-wrapper')
                : container;
            currentPattern.frames.forEach((f, i) => {
                const frame = wrapper.querySelector(`#frame-${i}`);
                if (!frame) return;
                const outer = getOuterSides(f);
                frame.style.borderTopWidth    = outer.top    ? '0' : `${innerW}px`;
                frame.style.borderLeftWidth   = outer.left   ? '0' : `${innerW}px`;
                frame.style.borderBottomWidth = outer.bottom ? '0' : `${innerW}px`;
                frame.style.borderRightWidth  = outer.right  ? '0' : `${innerW}px`;
            });
            wrapper.style.padding = `${outerW}px`;
            updateShadowShapes();
        }

        // Corners of the photo area clockwise from top left, with the sides meeting there
        const SHADOW_CORNERS = [['left', 'top'], ['top', 'right'], ['right', 'bottom'], ['bottom', 'left']];

        // Outline of the outer shadow area: the photo area grown by SHADOW_PAD on enabled sides,
        // mitred at 45° from each photo corner. Returns [cornerIndex, 'inner' | 'outer'] points.
        function getOuterShadowOutline(sides) {
            return SHADOW_CORNERS.flatMap(([a, b], i) => {
                if (sides[a] && sides[b]) return [[i, 'outer']];
                if (sides[a]) return [[i, 'outer'], [i, 'inner']];
                if (sides[b]) return [[i, 'inner'], [i, 'outer']];
                return [[i, 'inner']];
            });
        }

        // Limits each shadow to its enabled sides, in the preview
        function updateShadowShapes() {
            const wrapper = document.getElementById('composition-wrapper');
            SHADOW_SIDES.forEach(side => wrapper.classList.toggle(`inner-off-${side}`, !innerShadowSides[side]));

            const p = SHADOW_PAD;
            const xs = { inner: ['0%', '100%', '100%', '0%'], outer: [`${-p}px`, `calc(100% + ${p}px)`, `calc(100% + ${p}px)`, `${-p}px`] };
            const ys = { inner: ['0%', '0%', '100%', '100%'], outer: [`${-p}px`, `${-p}px`, `calc(100% + ${p}px)`, `calc(100% + ${p}px)`] };
            const points = getOuterShadowOutline(outerShadowSides).map(([c, k]) => `${xs[k][c]} ${ys[k][c]}`);
            wrapper.style.setProperty('--outer-shadow-clip', `polygon(${points.join(', ')})`);
        }

        function updateCornerRadius() {
            document.getElementById('composition-wrapper').style.setProperty('--corner-radius', `${cornerRadius}px`);
        }

        // Each photo casts an even shadow onto the lines around it, on all four sides.
        // Shared by the preview (CSS box-shadow) and the export (canvas), in preview px.
        function getOuterShadows() {
            if (!shadowSize) return [];
            return [
                { x: 0, y: 0, blur: shadowSize, color: 'rgba(0, 0, 0, 0.75)' },
            ];
        }

        function updateOuterShadow() {
            const shadows = getOuterShadows();
            const css = shadows.length
                ? shadows.map(s => `${s.x}px ${s.y}px ${s.blur}px ${s.color}`).join(', ')
                : 'none';
            document.getElementById('composition-wrapper').style.setProperty('--outer-shadow', css);
        }

        // Even shadow just inside each photo's edges, on all four sides. Same units as getOuterShadows.
        function getInnerShadows() {
            if (!innerShadowSize) return [];
            return [
                { x: 0, y: 0, blur: innerShadowSize, color: 'rgba(0, 0, 0, 0.75)' },
            ];
        }

        function updateInnerShadow() {
            const shadows = getInnerShadows();
            const css = shadows.length
                ? shadows.map(s => `drop-shadow(${s.x}px ${s.y}px ${s.blur}px ${s.color})`).join(' ')
                : 'none';
            document.getElementById('composition-wrapper').style.setProperty('--inner-shadow', css);
        }

        // Canvas has no inset shadow: fill a ring around the (already clipped) photo area
        // so only its shadow falls inside, matching CSS `box-shadow: inset`
        // Same shapes as the preview's .caster elements, drawn just outside the (already clipped)
        // photo area so only their shadow falls inside
        function drawInnerShadow(ctx, x, y, w, h, radius, scale) {
            const shadows = getInnerShadows();
            if (!shadows.length) return;

            const p = SHADOW_PAD * scale;
            const r = Math.min(radius, w / 2, h / 2);
            const on = innerShadowSides;
            const shape = pts => {
                ctx.moveTo(...pts[0]);
                pts.slice(1).forEach(pt => ctx.lineTo(...pt));
                ctx.closePath();
            };

            ctx.save();
            ctx.beginPath();
            if (on.top)    shape([[x - p, y - p], [x + w + p, y - p], [x + w, y], [x, y]]);
            if (on.right)  shape([[x + w + p, y - p], [x + w + p, y + h + p], [x + w, y + h], [x + w, y]]);
            if (on.bottom) shape([[x + w + p, y + h + p], [x - p, y + h + p], [x, y + h], [x + w, y + h]]);
            if (on.left)   shape([[x - p, y + h + p], [x - p, y - p], [x, y], [x, y + h]]);
            if (r > 0) {
                if (on.top && on.left)     { ctx.moveTo(x, y);         ctx.lineTo(x + r, y);         ctx.arc(x + r, y + r, r, -Math.PI / 2, Math.PI, true);         ctx.closePath(); }
                if (on.top && on.right)    { ctx.moveTo(x + w, y);     ctx.lineTo(x + w, y + r);     ctx.arc(x + w - r, y + r, r, 0, -Math.PI / 2, true);           ctx.closePath(); }
                if (on.bottom && on.right) { ctx.moveTo(x + w, y + h); ctx.lineTo(x + w - r, y + h); ctx.arc(x + w - r, y + h - r, r, Math.PI / 2, 0, true);       ctx.closePath(); }
                if (on.bottom && on.left)  { ctx.moveTo(x, y + h);     ctx.lineTo(x, y + h - r);     ctx.arc(x + r, y + h - r, r, Math.PI, Math.PI / 2, true);      ctx.closePath(); }
            }
            ctx.fillStyle = 'black';
            shadows.forEach(s => {
                ctx.shadowColor = s.color;
                ctx.shadowOffsetX = s.x * scale;
                ctx.shadowOffsetY = s.y * scale;
                ctx.shadowBlur = s.blur * scale;
                ctx.fill();
            });
            ctx.restore();
        }

        // Draws the photo area's shadow onto its share of the lines (cell box minus photo area),
        // matching CSS: an outer box-shadow never shows under its own element
        function drawOuterShadow(ctx, x, y, w, h, radius, scale) {
            const shadows = getOuterShadows();
            if (!shadows.length) return;

            const p = SHADOW_PAD * scale;
            const xs = { inner: [x, x + w, x + w, x], outer: [x - p, x + w + p, x + w + p, x - p] };
            const ys = { inner: [y, y, y + h, y + h], outer: [y - p, y - p, y + h + p, y + h + p] };

            ctx.save();
            ctx.beginPath();
            getOuterShadowOutline(outerShadowSides).forEach(([c, k]) => ctx.lineTo(xs[k][c], ys[k][c]));
            ctx.closePath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.clip('evenodd');

            // Fill the shape far off to the side and shift its shadow back, so only the shadow lands
            const away = w + h + 1000;
            shadows.forEach(s => {
                ctx.shadowColor = s.color;
                ctx.shadowOffsetX = s.x * scale + away;
                ctx.shadowOffsetY = s.y * scale;
                ctx.shadowBlur = s.blur * scale;
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.roundRect(x - away, y, w, h, radius);
                ctx.fill();
            });
            ctx.restore();
        }

        function selectFrame(i) {
            selectedFrameIndex = i;
            document.getElementById(`frame-${i}`).classList.add('selected');

            const adj = frameAdjustments[i];
            const zoomPct = Math.round(adj.zoom * 100);
            document.getElementById('zoom-slider').value = zoomPct;
            document.getElementById('zoom-value').value = zoomPct;
            document.getElementById('x-slider').value = adj.x;
            document.getElementById('x-value').value = adj.x;
            document.getElementById('y-slider').value = adj.y;
            document.getElementById('y-value').value = adj.y;

            document.getElementById('frame-settings').classList.add('visible');
        }

        function deselectAll() {
            selectedFrameIndex = null;
            document.querySelectorAll('.frame.selected').forEach(f => f.classList.remove('selected'));
            document.getElementById('frame-settings').classList.remove('visible');
        }

        function applyFrameAdjustment(i) {
            const image = document.querySelector(`#frame-${i} .frame-image`);
            if (!image) return;
            const { zoom, x, y } = frameAdjustments[i];
            image.style.transform = `scale(${zoom}) translate(${x}%, ${y}%)`;
        }

        // Zooms the photo just enough to cover its cell (it starts out fitted inside it)
        function autoFitFrame(i) {
            const src = loadedImages[i];
            if (!src) return;
            const cell = document.querySelector(`#frame-${i} .frame-inner`);
            const img = new Image();
            img.onload = () => {
                const cellRatio = cell.clientWidth / cell.clientHeight;
                const imgRatio = img.naturalWidth / img.naturalHeight;
                const zoomPct = Math.min(300, Math.ceil(Math.max(cellRatio / imgRatio, imgRatio / cellRatio) * 100));

                frameAdjustments[i].zoom = zoomPct / 100;
                applyFrameAdjustment(i);
                if (selectedFrameIndex === i) {
                    document.getElementById('zoom-slider').value = zoomPct;
                    document.getElementById('zoom-value').value = zoomPct;
                }
            };
            img.src = src;
        }

        function clearFrame(i) {
            loadedImages[i] = null;
            frameAdjustments[i] = { zoom: 1, x: 0, y: 0 };
            const image = document.querySelector(`#frame-${i} .frame-image`);
            if (image) {
                image.style.backgroundImage = '';
                image.style.transform = '';
            }
            deselectAll();
        }

        function swapFrames(a, b) {
            [loadedImages[a], loadedImages[b]] = [loadedImages[b] || null, loadedImages[a] || null];
            [frameAdjustments[a], frameAdjustments[b]] = [frameAdjustments[b], frameAdjustments[a]];
            renderFrames(loadedImages);
            applyFrameAdjustment(a);
            applyFrameAdjustment(b);
            deselectAll();
            selectFrame(b);
        }

        function replaceFrame(i) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/jpeg,image/png';
            input.addEventListener('change', function () {
                const file = this.files[0];
                if (!file || !ACCEPTED_TYPES.includes(file.type)) return;
                loadImages([file])
                    .then(([src]) => {
                        loadedImages[i] = src;
                        frameAdjustments[i] = { zoom: 1, x: 0, y: 0 };
                        renderFrames(loadedImages);
                        applyFrameAdjustment(i);
                        selectFrame(i);
                    })
                    .catch(err => console.error('Failed to replace image:', err));
            });
            input.click();
        }

        function loadImages(files) {
            const promises = files.map(file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = () => reject(new Error(`Failed to read: ${file.name}`));
                reader.readAsDataURL(file);
            }));
            return Promise.all(promises);
        }

        function renderFrames(images) {
            if (!currentPattern) return;
            images.forEach((src, i) => {
                const image = document.querySelector(`#frame-${i} .frame-image`);
                if (!image) return;
                image.style.backgroundImage = src ? `url(${src})` : '';
            });
        }

        function generateFilename() {
            const now = new Date();
            const date = now.toLocaleDateString('en-CA'); // YYYY-MM-DD
            const time = now.toTimeString().slice(0, 8).replace(/:/g, '-'); // HH-MM-SS
            const res = RESOLUTIONS.find(r => r.value === exportResolution)?.label ?? `${exportResolution}px`;
            return `PhotoComp_${date}_${time}_${res}.jpeg`;
        }

        function saveToJpg() {
            document.getElementById('export-overlay').classList.add('visible');

            const scale = exportResolution / 600;
            const scaledBorder = Math.round(borderWidth * scale);
            const scaledOuterBorder = Math.round(outerBorderWidth * scale);
            const scaledCorner = cornerRadius * scale;
            const exportTotal = exportResolution + 2 * scaledOuterBorder;

            const imagePromises = loadedImages.map(src => {
                if (!src) return Promise.resolve(null);
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = src;
                });
            });

            Promise.all(imagePromises)
                .then(images => {
                    const canvas = document.createElement('canvas');
                    canvas.width = exportTotal;
                    canvas.height = exportTotal;
                    const ctx = canvas.getContext('2d');

                    // White base — covers outer border + inner grid lines
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, exportTotal, exportTotal);

                    // Photo area of each cell, inside its share of the lines
                    const areas = currentPattern.frames.map(f => {
                        const outer = getOuterSides(f);

                        const fx = scaledOuterBorder + f.left / 100 * exportResolution;
                        const fy = scaledOuterBorder + f.top / 100 * exportResolution;
                        const fw = f.width / 100 * exportResolution;
                        const fh = f.height / 100 * exportResolution;

                        const bT = outer.top    ? 0 : scaledBorder;
                        const bL = outer.left   ? 0 : scaledBorder;
                        const bR = outer.right  ? 0 : scaledBorder;
                        const bB = outer.bottom ? 0 : scaledBorder;

                        return { x: fx + bL, y: fy + bT, w: fw - bL - bR, h: fh - bT - bB };
                    });

                    // Outer shadows first, under every photo, like the preview
                    areas.forEach(a => drawOuterShadow(ctx, a.x, a.y, a.w, a.h, scaledCorner, scale));

                    areas.forEach(({ x: innerX, y: innerY, w: innerW, h: innerH }, i) => {
                        const img = images[i];

                        ctx.save();
                        ctx.beginPath();
                        ctx.roundRect(innerX, innerY, innerW, innerH, scaledCorner);
                        ctx.clip();

                        // Opaque photo area, so neighbouring shadows never show through letterboxing
                        ctx.fillStyle = 'white';
                        ctx.fillRect(innerX, innerY, innerW, innerH);

                        if (img) {
                            const adj = frameAdjustments[i] || { zoom: 1, x: 0, y: 0 };

                            // Replicate background-size: contain
                            const containScale = Math.min(innerW / img.naturalWidth, innerH / img.naturalHeight);
                            const renderedW = img.naturalWidth * containScale;
                            const renderedH = img.naturalHeight * containScale;
                            const cx = (innerW - renderedW) / 2;
                            const cy = (innerH - renderedH) / 2;

                            // Replicate transform: scale(zoom) translate(x%, y%)
                            const zoom = adj.zoom;
                            const finalW = renderedW * zoom;
                            const finalH = renderedH * zoom;
                            const finalX = innerW / 2 + (cx - innerW / 2) * zoom + innerW * adj.x / 100;
                            const finalY = innerH / 2 + (cy - innerH / 2) * zoom + innerH * adj.y / 100;

                            ctx.drawImage(img, innerX + finalX, innerY + finalY, finalW, finalH);
                        }

                        drawInnerShadow(ctx, innerX, innerY, innerW, innerH, scaledCorner, scale);
                        ctx.restore();
                    });

                    const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
                    const link = document.createElement('a');
                    link.download = generateFilename();
                    link.href = dataUrl;
                    link.click();
                })
                .catch(err => {
                    console.error('Export failed:', err);
                    alert('Export failed. See console for details.');
                })
                .finally(() => {
                    document.getElementById('export-overlay').classList.remove('visible');
                });
        }

        init();
    </script>
</body>
</html>
