<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhotoComp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Photo Comp</h1>

    <div id="layout">
        <aside id="sidebar">
            <div id="photo-section">
                <div class="label">Photos</div>
                <label class="file-label" id="file-label" for="file">Choose photos</label>
                <input type="file" id="file" accept="image/jpeg,image/png" multiple>
            </div>

            <div class="label">Number of photos</div>
            <div class="count-picker" id="count-picker"></div>

            <div id="pattern-section">
                <div class="label">Layout</div>
                <div class="pattern-list" id="pattern-list"></div>
            </div>

            <div id="grid-controls">
                <div class="label">Grid</div>
                <div class="setting-row">
                    <span>Outer border</span>
                    <input type="range" id="outer-border-slider" min="0" max="30" value="5" step="1">
                    <input type="number" id="outer-border-value" min="0" max="30" value="5" step="1">
                </div>
                <div class="setting-row">
                    <span>Line width</span>
                    <input type="range" id="border-slider" min="0" max="30" value="5" step="1">
                    <input type="number" id="border-value" min="0" max="30" value="5" step="1">
                </div>
                <div class="setting-row">
                    <span>Corners</span>
                    <input type="range" id="corner-slider" min="0" max="50" value="0" step="1">
                    <input type="number" id="corner-value" min="0" max="50" value="0" step="1">
                </div>
                <div class="setting-row">
                    <span>Outer shadow</span>
                    <input type="range" id="shadow-slider" min="0" max="20" value="0" step="1">
                    <input type="number" id="shadow-value" min="0" max="20" value="0" step="1">
                </div>
                <div class="side-toggles" id="outer-shadow-sides">
                    <button class="side-btn active" data-side="top">Top</button>
                    <button class="side-btn active" data-side="bottom">Bottom</button>
                    <button class="side-btn active" data-side="left">Left</button>
                    <button class="side-btn active" data-side="right">Right</button>
                </div>
                <div class="setting-row">
                    <span>Inner shadow</span>
                    <input type="range" id="inner-shadow-slider" min="0" max="20" value="0" step="1">
                    <input type="number" id="inner-shadow-value" min="0" max="20" value="0" step="1">
                </div>
                <div class="side-toggles" id="inner-shadow-sides">
                    <button class="side-btn active" data-side="top">Top</button>
                    <button class="side-btn active" data-side="bottom">Bottom</button>
                    <button class="side-btn active" data-side="left">Left</button>
                    <button class="side-btn active" data-side="right">Right</button>
                </div>
            </div>

            <div id="export-section">
                <div class="label">Export</div>
                <div id="export-row">
                    <div class="res-picker" id="res-picker"></div>
                    <button id="save" class="setting-btn success" disabled>Export JPEG</button>
                </div>
            </div>

            <div class="actions"></div>
        </aside>

        <main id="canvas-area">
            <div class="label" id="composition-label">Composition</div>
            <div id="composition-wrapper">
                <div id="composition"></div>
            </div>

            <div id="frame-settings">
                <div class="label">Selected photo</div>
                <div class="setting-actions">
                    <button class="setting-btn" id="fit-btn">Auto fit</button>
                </div>
                <div class="setting-row">
                    <span>Zoom</span>
                    <input type="range" id="zoom-slider" min="100" max="300" value="100" step="1">
                    <input type="number" id="zoom-value" min="100" max="300" value="100" step="1">
                </div>
                <div class="setting-row">
                    <span>Horizontal</span>
                    <input type="range" id="x-slider" min="-50" max="50" value="0" step="1">
                    <input type="number" id="x-value" min="-50" max="50" value="0" step="1">
                </div>
                <div class="setting-row">
                    <span>Vertical</span>
                    <input type="range" id="y-slider" min="-50" max="50" value="0" step="1">
                    <input type="number" id="y-value" min="-50" max="50" value="0" step="1">
                </div>
                <div class="setting-row">
                    <span>Rotation</span>
                    <input type="range" id="rotation-slider" min="-180" max="180" value="0" step="1">
                    <input type="number" id="rotation-value" min="-180" max="180" value="0" step="1">
                </div>
                <div class="setting-row">
                    <span>Brightness</span>
                    <input type="range" id="brightness-slider" min="0" max="200" value="100" step="1">
                    <input type="number" id="brightness-value" min="0" max="200" value="100" step="1">
                </div>
                <div class="setting-row">
                    <span>Contrast</span>
                    <input type="range" id="contrast-slider" min="0" max="200" value="100" step="1">
                    <input type="number" id="contrast-value" min="0" max="200" value="100" step="1">
                </div>
                <div class="setting-actions">
                    <button class="setting-btn" id="replace-btn">Replace photo</button>
                    <button class="setting-btn danger" id="clear-btn">Clear</button>
                </div>
            </div>
        </main>
    </div>

    <div id="export-overlay">
        <div class="export-card">
            <p>Exporting…</p>
            <div class="progress-track"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
